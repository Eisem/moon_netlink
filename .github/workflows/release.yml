name: Release artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/moonnetlink-toolchain
          key: moonbit-linux-x64-${{ hashFiles('.ci/toolchain-lock.json') }}
      - run: |
          bash .ci/install-toolchain.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update && sudo apt-get install -y build-essential iproute2 python3 util-linux
      - name: Permit isolated user namespaces on runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: |
          moon update
          moon fmt --check
          moon check --target native --warn-list +73
          bash .ci/check-coverage.sh
          for script in .ci/validate-*.sh; do
            [[ "$script" == .ci/validate-consumer.sh ]] && continue
            timeout --kill-after=10s 180s bash "$script"
          done
          timeout --kill-after=10s 300s bash demo/compare/run.sh
          moon info --target native
          git diff --exit-code
          bash .ci/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: moonnetlink-release-linux-x86_64
          path: _build/release/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: moonnetlink-release-linux-x86_64
          path: release
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "MoonNetlink $GITHUB_REF_NAME" --notes-file ../CHANGELOG.md ./*
