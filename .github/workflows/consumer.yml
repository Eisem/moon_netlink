name: Published package consumer
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Mooncakes version
        default: '0.1.1'
        required: true
  release:
    types: [published]
permissions:
  contents: read
jobs:
  release-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VERSION: ${{ inputs.version || '0.1.1' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and run downloaded release
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir release
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir release
          cd release
          sha256sum --check SHA256SUMS
          tar -xzf "moonnetlink-$VERSION-linux-x86_64.tar.gz"
          "./moonnetlink-$VERSION-linux-x86_64/moonnet" link show --json | python3 -c 'import json,sys; assert any(row["name"] == "lo" for row in json.load(sys.stdin))'
  consumer:
    runs-on: ubuntu-24.04
    env:
      MOONNETLINK_CONSUMER_VERSION: ${{ inputs.version || '0.1.1' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/moonnetlink-toolchain
          key: moonbit-linux-x64-${{ hashFiles('.ci/toolchain-lock.json') }}
      - run: |
          bash .ci/install-toolchain.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update && sudo apt-get install -y build-essential iproute2 python3 util-linux
      - name: Permit isolated user namespaces on runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: timeout --kill-after=10s 300s bash .ci/validate-consumer.sh
