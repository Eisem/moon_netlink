name: Published package consumer
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moon.sh
          bash /tmp/install-moon.sh 0.1.20260920
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update && sudo apt-get install -y build-essential iproute2 python3 util-linux
      - name: Permit isolated user namespaces on runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: timeout --kill-after=10s 300s bash .ci/validate-consumer.sh
